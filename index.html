<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeonCasa & Co.</title>
    
    <!-- ========================================== -->
    <!-- EDIT YOUR WEBSITE SEO & SOCIAL SHARING HERE -->
    <!-- ========================================== -->
    
    <!-- Description that appears in Google Search results -->
    <meta name="description" content="Discover beautifully crafted furniture sourced from trusted manufacturers around the world, selected for exceptional design, quality, and timeless appeal." />
    
    <!-- Title that appears when sharing on Facebook, LinkedIn, iMessage, etc. -->
    <meta property="og:title" content="LeonCasa & Co. | Premium Furniture" />
    
    <!-- Description for social sharing -->
    <meta property="og:description" content="Discover premium handcrafted furniture and modern interior design pieces." />
    
    <!-- Image URL that appears when sharing the link (Must be a full URL starting with https://) -->
    <meta property="og:image" content="https://img.sanishtech.com/u/28f687e55d161c4a12a6fe766d698630.png" />
    
    <!-- ========================================== -->
    <script>
      const observerErr = 'ResizeObserver loop completed with undelivered notifications.';
      window.addEventListener('error', (e) => {
        if (e.message === observerErr || e.message.includes(observerErr)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      const originalError = console.error;
      console.error = (...args) => {
        if (typeof args[0] === 'string' && args[0].includes(observerErr)) return;
        originalError.call(console, ...args);
      };
    </script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: white;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
      <script>
      // Attempt to disable right-click and inspection shortcuts
      document.addEventListener('contextmenu', event => event.preventDefault());
      document.onkeydown = function (e) {
        if (
          e.key === 'F12' || 
          (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
          (e.metaKey && e.altKey && (e.key === 'i' || e.key === 'j' || e.key === 'c')) || // Mac equivalents
          (e.ctrlKey && e.key === 'U') ||
          (e.metaKey && e.key === 'u') // Mac view source
        ) {
          e.preventDefault();
          return false;
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
