<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeonCasa & Co.</title>
    <script>
      const observerErr = 'ResizeObserver loop completed with undelivered notifications.';
      window.addEventListener('error', (e) => {
        if (e.message === observerErr || e.message.includes(observerErr)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      const originalError = console.error;
      console.error = (...args) => {
        if (typeof args[0] === 'string' && args[0].includes(observerErr)) return;
        originalError.call(console, ...args);
      };
    </script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: white;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
